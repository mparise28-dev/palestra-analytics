<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palestra Analytics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header com navegação -->
    <header class="main-header">
        <div class="logo">
            <h1>Palestra Analytics</h1>
        </div>
        <nav class="main-nav">
            <a href="/" class="nav-link active">Jogos</a>
            <a href="/estatisticas" class="nav-link">Estatísticas</a>
            <a href="/elenco" class="nav-link">Elenco</a>
        </nav>
        <div class="auth-buttons">
            <button id="loginBtn" class="btn btn-outline">Login</button>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main id="app">
        <section class="hero">
            <h2>Bem-vindo ao Palestra Analytics</h2>
            <p>Análise completa de desempenho do seu time</p>
        </section>

        <section class="content">
            <div class="card">
                <h3>Últimos Jogos</h3>
                <div id="jogos-container">
                    <p>Carregando jogos...</p>
                </div>
            </div>

            <div class="card">
                <h3>Estatísticas Rápidas</h3>
                <div id="stats-container">
                    <p>Carregando estatísticas...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <p>&copy; 2024 Palestra Analytics - Todos os direitos reservados</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
