<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Conta | Palestra Analytics</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/register.css" />
  </head>
  <body>
    <div class="register-container">
      <div class="register-card">
        <div class="logo">
          <h1>🐷 <span>Palestra</span> Analytics</h1>
          <p>Crie sua conta e acompanhe o Verdão</p>
        </div>

        <div id="message-area"></div>

        <form id="register-form">
          <div class="form-group">
            <label>Nome de usuário</label>
            <input
              type="text"
              id="username"
              required
              placeholder="ex: palmeirense_fan"
            />
          </div>

          <div class="form-group">
            <label>E-mail</label>
            <input
              type="email"
              id="email"
              required
              placeholder="seu@email.com"
            />
          </div>

          <div class="form-group">
            <label>Senha</label>
            <input
              type="password"
              id="password"
              required
              placeholder="mínimo 6 caracteres"
            />
          </div>

          <div class="form-group">
            <label>Confirmar senha</label>
            <input
              type="password"
              id="confirm-password"
              required
              placeholder="digite a senha novamente"
            />
          </div>

          <button type="submit" class="btn-register">Criar Conta</button>
        </form>

        <div class="login-link">
          Já tem conta? <a href="#" id="open-login-modal">Faça login</a>
        </div>
      </div>
    </div>

    <!-- CARREGAR PRIMEIRO O MODAL (para ter a função openModal disponível) -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/modal-login.js"></script>
    <!-- DEPOIS O REGISTER -->
    <script src="../js/register.js"></script>
  </body>
</html>
