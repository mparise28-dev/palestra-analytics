<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Palestra Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">
            <span class="logo-icon">🐷</span>
            <span class="logo-text"
              >PALESTRA <span class="logo-highlight">ANALYTICS</span></span
            >
          </div>
          <p class="login-subtitle">
            Acesse sua conta para comentar, curtir e favoritar
          </p>
        </div>

        <form id="loginForm" class="login-form">
          <div class="input-group">
            <label for="email">E-mail</label>
            <div class="input-wrapper">
              <span class="input-icon">📧</span>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="seu@email.com"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <div class="input-group">
            <label for="password">Senha</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                id="togglePassword"
                class="toggle-password"
                tabindex="-1"
              >
                👁️
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" />
              <span>Lembrar-me</span>
            </label>
            <a href="#" class="forgot-password">Esqueceu a senha?</a>
          </div>

          <button type="submit" id="submitBtn" class="btn-login-submit">
            <span class="btn-text">Entrar</span>
            <span class="btn-loading" style="display: none">⏳</span>
          </button>
        </form>

        <div
          id="errorMessage"
          class="error-message"
          style="display: none"
        ></div>

        <div class="login-footer">
          <p>
            Não tem uma conta?
            <a href="register.html" class="register-link">Criar conta grátis</a>
          </p>
          <div class="demo-info">
            <p>🔐 <strong>Demo:</strong></p>
            <p>admin@palestra.com / admin123</p>
            <p>user@palestra.com / user123</p>
          </div>
        </div>
      </div>

      <div class="login-bg-decoration">
        <div class="bg-pattern"></div>
      </div>
    </div>

    <script src="../js/login.js"></script>
  </body>
</html>
